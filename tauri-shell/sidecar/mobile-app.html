<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<title>DSH Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111418;color:#e8eaed;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#161b22;border-bottom:1px solid #232b36}
header h1{flex:1;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{flex:none;border:1px solid #2b333d;background:#1c2128;color:#e8eaed;border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer}
.hbtn:active{background:#242c37}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px}
.banner{flex:none;display:none;background:#3a1f24;color:#ffb4b8;padding:8px 12px;font-size:13px;text-align:center}
.banner button{margin-left:10px;background:#5a2a30;border:none;color:#ffb4b8;border-radius:8px;padding:3px 10px;font-size:12px}
.card{background:#1c2128;border:1px solid #232b36;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:active{background:#222936}
.card .t{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:#8a94a3}
.badge{background:#1e3a5f;color:#7cc0ff;border-radius:999px;padding:2px 8px;font-size:11px}
.badge.new{background:#2a3340;color:#aab2bd}
.msg{max-width:86%;margin-bottom:10px;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{margin-left:auto;background:#1e3a5f;border-bottom-right-radius:4px}
.msg.assistant{margin-right:auto;background:#1c2128;border:1px solid #232b36;border-bottom-left-radius:4px}
.msg .meta{margin-top:6px;font-size:11px;color:#77839a}
.toolrow{font-size:12px;color:#6d788a;padding:2px 0 2px 8px}
.thinking{font-size:12px;color:#7cc0ff;padding:4px 12px 10px}
.empty{color:#6d788a;text-align:center;padding:40px 20px;font-size:14px;line-height:1.8}
footer{flex:none;background:#161b22;border-top:1px solid #232b36;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.inputrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:#1c2128;border:1px solid #2b333d;border-radius:12px;color:#e8eaed;font-family:inherit;font-size:15px;line-height:1.4;padding:9px 11px;max-height:120px;min-height:40px;outline:none}
.send{flex:none;border:none;background:#2f6fce;color:#fff;border-radius:12px;width:44px;height:40px;font-size:15px;cursor:pointer}
.send.stop{background:#8a3a3a}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a3340;color:#e8eaed;border-radius:10px;padding:9px 16px;font-size:13px;max-width:80vw;display:none;z-index:9}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:flex-end}
.sheet .panel{background:#1c2128;border-radius:18px 18px 0 0;width:100%;max-height:70vh;overflow-y:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:15px;margin:0 0 10px;color:#aab2bd}
.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.opt:active{background:#242c37}
.opt .sub{font-size:12px;color:#8a94a3;margin-top:2px}
.opt.cur{background:#1e3a5f}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #7cc0ff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header id="hdr">
  <button class="hbtn" id="back" style="display:none">‹ 列表</button>
  <h1 id="title">DSH 会话</h1>
  <button class="hbtn" id="modelBtn" style="display:none">模型</button>
  <button class="hbtn" id="newBtn">＋</button>
</header>
<main id="main"><div class="empty" id="empty">正在加载会话…</div></main>
<div class="thinking" id="thinking" style="display:none"><span class="spin"></span>思考中…</div>
<footer id="ftr" style="display:none">
  <div class="inputrow">
    <textarea id="input" rows="1" placeholder="输入消息，回车发送"></textarea>
    <button class="send" id="send">↑</button>
  </div>
</footer>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<script>
'use strict';
var state = { view: 'list', sessionId: null, sessionTitle: '', pollTimer: null, lastSeq: 0, oldestSeq: null, hasMore: false, running: false, historyLoading: false, pageSize: 50 };

function $(id) { return document.getElementById(id); }
function toast(text) {
  var t = $('toast');
  t.textContent = text; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.style.display = 'none'; }, 2600);
}
function banner(text) {
  var b = $('banner');
  if (!text) { b.style.display = 'none'; return; }
  b.innerHTML = '';
  var s = document.createElement('span'); s.textContent = text;
  var r = document.createElement('button'); r.textContent = '重试';
  r.onclick = function () { banner(null); if (state.view === 'list') loadList(); else loadHistory(true); };
  b.appendChild(s); b.appendChild(r); b.style.display = 'block';
}
function rpc(method, payload) {
  return fetch('/api/rpc', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ method: method, payload: payload || {} }),
  }).then(function (res) {
    if (res.status === 401) { showUnpaired(); throw new Error('not paired'); }
    return res.json();
  }).then(function (d) {
    if (d && d.ok === false) throw new Error((d.error && (d.error.message || d.error.code)) || '请求失败');
    if (d && d.ok === true) return d.value;
    if (d && d.error) throw new Error(typeof d.error === 'string' ? d.error : '请求失败');
    return d;
  });
}
function relTime(ms) {
  var diff = Date.now() - ms;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return Math.floor(diff / 86400000) + ' 天前';
}
function showUnpaired() {
  stopPoll();
  $('ftr').style.display = 'none'; $('modelBtn').style.display = 'none';
  showEmpty('尚未与桌面配对或配对已断开。<br>请在电脑端「设置 → 连接手机」重新扫码配对。');
}

/* empty 态统一入口：清空 main 后挂回 #empty（#empty 初始即 main 的子节点） */
function showEmpty(text) {
  var e = $('empty');
  e.innerHTML = text;
  $('main').innerHTML = '';
  $('main').appendChild(e);
  e.style.display = 'block';
  return e;
}
function hideEmpty() {
  var e = $('empty');
  if (e.parentNode === $('main')) e.style.display = 'none';
}

/* ---------- 页面 A：会话列表 ---------- */
function loadList() {
  banner(null);
  showEmpty('正在加载会话…');
  rpc('session.list').then(function (v) { renderList(v.items || []); }).catch(function (e) {
    if (e.message === 'not paired') return;
    $('empty').textContent = '加载失败：' + e.message;
    banner('与桌面连接中断');
  });
}
function renderList(items) {
  $('main').innerHTML = '';
  if (!items.length) {
    showEmpty('还没有会话。点右上角「＋」新建一个。');
    return;
  }
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var card = document.createElement('div');
    card.className = 'card';
    var t = document.createElement('div'); t.className = 't';
    var title = it.projections && it.projections.values && it.projections.values.title;
    t.textContent = (it.blank || !title) ? '新会话' : title;
    var m = document.createElement('div'); m.className = 'm';
    if (it.running) { var b1 = document.createElement('span'); b1.className = 'badge'; b1.textContent = '运行中'; m.appendChild(b1); }
    var b2 = document.createElement('span'); b2.className = 'badge new'; b2.textContent = relTime(it.updatedAt);
    m.appendChild(b2);
    if (it.agentPreset) { var b3 = document.createElement('span'); b3.textContent = it.agentPreset; m.appendChild(b3); }
    card.appendChild(t); card.appendChild(m);
    (function (sid, titleStr) {
      card.onclick = function () { openSession(sid, titleStr); };
    })(it.sessionId, t.textContent);
    $('main').appendChild(card);
  }
}

/* ---------- 页面 B：会话详情 ---------- */
function openSession(sid, title) {
  state.view = 'session'; state.sessionId = sid; state.sessionTitle = title || '会话';
  state.lastSeq = 0; state.oldestSeq = null; state.hasMore = true;
  $('back').style.display = ''; $('modelBtn').style.display = '';
  $('ftr').style.display = ''; $('title').textContent = state.sessionTitle;
  $('main').innerHTML = '';
  banner(null);
  loadHistory(true);
  startPoll();
}
function backToList() {
  state.view = 'list'; state.sessionId = null;
  stopPoll();
  $('back').style.display = 'none'; $('modelBtn').style.display = 'none';
  $('ftr').style.display = 'none'; $('thinking').style.display = 'none';
  $('title').textContent = 'DSH 会话';
  loadList();
}
function stopPoll() { if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; } }
function startPoll() {
  stopPoll();
  state.pollTimer = setInterval(function () {
    if (state.view === 'session' && !state.historyLoading) refreshTail();
  }, 2000);
}

// 抽取内容块：texts 为正文/思考文本，tools 为工具调用描述。user 消息取
// texts（textOf 语义），assistant 消息三类型各自归位（foldEvent 语义）。
function blockParts(blocks) {
  var texts = [], tools = [];
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    if (b.type === 'text' && b.text) texts.push(b.text);
    else if (b.type === 'reasoning' && b.text) texts.push('💭 ' + b.text.split('\n').slice(0, 2).join(' ').slice(0, 120) + (b.text.length > 120 ? '…' : ''));
    else if (b.type === 'tool-call' || b.type === 'tool_use' || b.type === 'toolCall') tools.push('🔧 ' + (b.name || b.toolName || '工具调用'));
  }
  return { texts: texts, tools: tools };
}
function textOf(content) { return blockParts(content || []).texts.join('\n'); }

function foldEvent(ev) {
  // 返回 {kind:'user'|'assistant'|'tool'|'skip', text, meta}；渲染规则见 SPEC §4.4
  var e = ev.event || {};
  if (e.surfaceOp === 'replace') return null; // 压缩替换副本，跳过
  var d = e.data || {};
  if (e.type === 'user/message') {
    return { kind: 'user', text: textOf(d.content), seq: e.seq };
  }
  if (e.type === 'assistant/message') {
    var msg = d.message || d;
    var blocks = msg.content || [];
    if (!blocks.length) return null;
    var p = blockParts(blocks);
    if (!p.texts.length && !p.tools.length) return null;
    return { kind: 'assistant', text: p.texts.join('\n\n'), tools: p.tools, seq: e.seq };
  }
  if (e.type === 'tool/result') return { kind: 'tool', text: '工具结果', seq: e.seq };
  return null;
}

// 逆扫事件流判定运行态:最近一个 turn/end → 未运行；turn/start → 运行中。
function scanRunning(flat) {
  var running = false;
  for (var i = flat.length - 1; i >= 0; i--) {
    var t = flat[i].event && flat[i].event.type;
    if (t === 'turn/end') break;
    if (t === 'turn/start') { running = true; break; }
  }
  return running;
}
function showRunning(running) {
  state.running = running;
  $('thinking').style.display = running && state.view === 'session' ? 'block' : 'none';
}

function loadHistory(reset) {
  if (!state.sessionId || state.historyLoading) return;
  state.historyLoading = true;
  var payload = { sessionId: state.sessionId, maxMessages: state.pageSize };
  if (!reset && state.oldestSeq !== null) payload.beforeSeq = state.oldestSeq;
  rpc('session.history', payload).then(function (v) { renderHistory(v, reset); }).catch(function (e) {
    if (e.message !== 'not paired') { banner('历史加载失败：' + e.message); }
  }).finally(function () { state.historyLoading = false; });
}
function renderHistory(v, reset) {
  var evs = (v.events || []).filter(function (ev) { return foldEvent(ev) !== null; });
  state.hasMore = !!v.hasMore;
  var flat = v.events || [];
  showRunning(scanRunning(flat));
  if (reset) {
    state.oldestSeq = evs.length ? evs[0].event.seq : null;
    var last = flat.length ? flat[flat.length - 1].event.seq : 0;
    state.lastSeq = last;
    if (!evs.length) { showEmpty('暂无消息，发第一条试试。'); }
    else { $('main').innerHTML = ''; }
    for (var k = 0; k < evs.length; k++) appendMsg(evs[k]);
    $('main').scrollTop = $('main').scrollHeight;
    updateSend();
  } else if (evs.length) {
    // 翻页： prepend 到顶部（保持当前滚动位置）
    var mainEl = $('main');
    var prevH = mainEl.scrollHeight, prevTop = mainEl.scrollTop;
    var frag = document.createDocumentFragment();
    for (var j = evs.length - 1; j >= 0; j--) frag.appendChild(buildMsg(evs[j]));
    mainEl.insertBefore(frag, mainEl.firstChild);
    mainEl.scrollTop = mainEl.scrollHeight - prevH + prevTop;
  }
  if (evs.length && (state.oldestSeq === null || evs[0].event.seq < state.oldestSeq)) state.oldestSeq = evs[0].event.seq;
}
function refreshTail() {
  if (!state.sessionId) return;
  rpc('session.history', { sessionId: state.sessionId, maxMessages: state.pageSize }).then(function (v) {
    var flat = v.events || [];
    var last = flat.length ? flat[flat.length - 1].event.seq : 0;
    showRunning(scanRunning(flat));
    if (last > state.lastSeq) {
      var fresh = [];
      for (var k = 0; k < flat.length; k++) {
        var ev = flat[k];
        if (ev.event.seq > state.lastSeq && foldEvent(ev) !== null) fresh.push(ev);
      }
      state.lastSeq = last;
      if (state.oldestSeq === null && flat.length) state.oldestSeq = flat[0].event.seq;
      hideEmpty();
      for (var m = 0; m < fresh.length; m++) appendMsg(fresh[m]);
      $('main').scrollTop = $('main').scrollHeight;
    }
    updateSend();
  }).catch(function () { /* 轮询失败静默，连续失败由 fetch 层 banner 提示 */ });
}
function buildMsg(ev) {
  var f = foldEvent(ev);
  var div = document.createElement('div');
  if (f.kind === 'tool') { div.className = 'toolrow'; div.textContent = '🔧 ' + f.text; return div; }
  div.className = 'msg ' + f.kind;
  div.textContent = f.text;
  if (f.tools && f.tools.length) {
    var tr = document.createElement('div'); tr.className = 'meta'; tr.textContent = f.tools.join(' · '); div.appendChild(tr);
  }
  if (f.kind === 'assistant') { var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'DSH'; div.appendChild(meta); }
  return div;
}
function appendMsg(ev) { $('main').appendChild(buildMsg(ev)); }
function updateSend() {
  var btn = $('send');
  if (state.running) { btn.textContent = '■'; btn.classList.add('stop'); btn.disabled = false; }
  else { btn.textContent = '↑'; btn.classList.remove('stop'); btn.disabled = false; }
}

/* ---------- 发送 / 停止 / 新建 / 模型 ---------- */
function sendDraft() {
  var input = $('input');
  var text = input.value.trim();
  if (!text || !state.sessionId) return;
  input.value = ''; input.style.height = 'auto';
  rpc('session.prompt', { sessionId: state.sessionId, mode: 'queue', content: [{ type: 'text', text: text }] }).then(function () {
    refreshTail();
  }).catch(function (e) {
    if (e.message !== 'not paired') toast('发送失败：' + e.message);
    input.value = text; // 还原草稿
  });
}
function stopRun() {
  if (!state.sessionId) return;
  rpc('session.cancel', { sessionId: state.sessionId }).then(function () { toast('已发送停止请求'); }).catch(function (e) { toast('停止失败：' + e.message); });
}
function newSession() {
  rpc('session.create', {}).then(function (v) {
    toast('已新建会话');
    openSession(v.sessionId, '新会话');
  }).catch(function (e) { if (e.message !== 'not paired') toast('新建失败：' + e.message); });
}
function pickModel() {
  if (!state.sessionId) return;
  var panel = $('sheetPanel');
  panel.innerHTML = '<h2>加载模型列表…</h2>';
  $('sheet').style.display = 'flex';
  rpc('session.models', { sessionId: state.sessionId }).then(function (v) {
    panel.innerHTML = '<h2>选择模型</h2>';
    var cur = v.current || {};
    var groups = v.groups || [];
    for (var g = 0; g < groups.length; g++) {
      var gh = document.createElement('h2'); gh.textContent = groups[g].name || groups[g].id; gh.style.margin = '12px 0 4px'; gh.style.fontSize = '12px';
      panel.appendChild(gh);
      var models = groups[g].models || [];
      for (var m = 0; m < models.length; m++) {
        (function (group, model) {
          var isCur = cur.provider === (model.provider || group.id) && cur.model === model.id;
          var opt = document.createElement('div'); opt.className = 'opt' + (isCur ? ' cur' : '');
          var left = document.createElement('div');
          var n = document.createElement('div'); n.textContent = model.name || model.id;
          left.appendChild(n);
          if (model.description) { var s = document.createElement('div'); s.className = 'sub'; s.textContent = model.description; left.appendChild(s); }
          var right = document.createElement('div'); right.className = 'sub'; right.textContent = isCur ? '当前' : '';
          opt.appendChild(left); opt.appendChild(right);
          opt.onclick = function () {
            rpc('session.selectModel', { sessionId: state.sessionId, provider: model.provider || group.id, model: model.id, reasoningEffort: model.reasoning ? model.reasoning.defaultEffort : undefined }).then(function () {
              $('sheet').style.display = 'none'; toast('已切换到 ' + (model.name || model.id));
            }).catch(function (e) { toast('切换失败：' + e.message); });
          };
          panel.appendChild(opt);
        })(groups[g], models[m]);
      }
    }
    if (!groups.length) { var e2 = document.createElement('div'); e2.className = 'empty'; e2.textContent = '没有可选模型'; panel.appendChild(e2); }
  }).catch(function (e) {
    panel.innerHTML = '<h2>加载失败</h2>';
    var d = document.createElement('div'); d.className = 'empty'; d.textContent = e.message; panel.appendChild(d);
  });
}

/* ---------- 事件接线 ---------- */
$('back').onclick = backToList;
$('newBtn').onclick = newSession;
$('modelBtn').onclick = pickModel;
$('send').onclick = function () { if (state.running) stopRun(); else sendDraft(); };
$('input').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(120, this.scrollHeight) + 'px'; });
$('input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!state.running) sendDraft(); }
});
$('sheet').onclick = function (e) { if (e.target === this) this.style.display = 'none'; };
$('main').addEventListener('scroll', function () {
  if (state.view !== 'session' || !state.hasMore || state.historyLoading) return;
  if ($('main').scrollTop < 60) loadHistory(false);
});
window.addEventListener('focus', function () { if (state.view === 'list') loadList(); });

/* ---------- 启动 ---------- */
loadList();
</script>
</body>
</html>
