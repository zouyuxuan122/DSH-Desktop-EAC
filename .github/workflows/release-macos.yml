# macOS（Apple Silicon arm64）桌面版发布管线
#
# - 全链路与仓库既有 Linux/Windows 发布一致：L1 Tauri 壳 + L2 sidecar + L3 内核
# - 本 workflow 构建 → 打包 .app/.dmg → 创建 Draft Release 并上传资产、生成校验和
# - 出 Draft 而非直接 Publish：发布动作留给人审阅（草稿在 GitHub 上不可见，点 Publish 前用户可控）
# - 该管线也兼任常驻 macOS CI/打包验证（PR #234 的 macos-port 全线在 macos-14 实测通过）
#
# 触发：仅 workflow_dispatch（不挂 push/PR 事件，避免无谓消耗 macOS runner 分钟数；
#       需要打包验证时手动触发一次即可）
#
# tag 两种用法：
#   - 已存在的 tag（如 v5.1.0）→ 把 .app.zip/.dmg/校验和 追加进该 Release（多平台同 tag 发布）
#   - 不存在的 tag → 创建 Draft Release 待人工 Publish
# ⚠️ 注意：新建 v* 标签会连带触发 release-tauri.yml 的 Windows/Linux 发布管线（属预期行为）
name: release-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（不要以 v 开头，示例 macos-arm64-5.1.0）'
        required: true
        type: string
        default: 'macos-arm64-5.1.0'

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: macOS arm64 构建并创建草稿 Release
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链（stable → aarch64-apple-darwin）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表与原生模块构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-desktop/native/supervisor/target
            dsh-desktop/native/snapshot/target
          key: dsh-cargo-darwin-arm64-${{ hashFiles('dsh-desktop/native/*/Cargo.lock') }}
          restore-keys: |
            dsh-cargo-darwin-arm64-

      - name: 安装依赖 + 获取 darwin runtime（vendor node）
        run: npm ci && npm run fetch-runtime

      - name: 类型检查（tsc --noEmit 零错误）
        run: npm run typecheck

      - name: 全量测试（darwin）
        run: npm test

      - name: Rust 原生模块 clippy、测试与构建（supervisor + snapshot）
        run: |
          npm run clippy:native
          npm run clippy:native -- snapshot
          npm run test:native
          npm run test:native -- snapshot
          npm run build:native
          npm run build:native -- snapshot

      - name: 装配 darwin 资源树（stage-resources --target=darwin）
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/stage-resources.mjs --target=darwin

      - name: Tauri 构建（.app + .dmg）
        working-directory: tauri-shell
        run: npx -y @tauri-apps/cli@2 build --ci

      - name: 审计 .app bundle 结构与内容
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -eu
          APP="tauri-shell/target/release/bundle/macos/Deepseek Harness EAC.app"
          test -d "$APP" || { echo ".app 未生成"; exit 1; }
          test -f "$APP/Contents/MacOS/dsh-eac-shell" || { echo "main 二进制缺失"; exit 1; }
          test -f "$APP/Contents/Resources/sidecar/server.js" || { echo "Contents/Resources/sidecar/server.js 缺失"; exit 1; }
          test -d "$APP/Contents/Resources/dsh-desktop" || { echo "Contents/Resources/dsh-desktop 缺失"; exit 1; }
          DMG_SRC="$(find tauri-shell/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$DMG_SRC" || { echo ".dmg 未生成"; exit 1; }
          echo "DMG: $DMG_SRC"
          ls -lh tauri-shell/target/release/bundle/macos/ tauri-shell/target/release/bundle/dmg/

      - name: 组装发布资产（.app.zip + .dmg 统一命名 + 校验和）
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -eu
          VERSION="5.1.0"
          APP="tauri-shell/target/release/bundle/macos/Deepseek Harness EAC.app"
          DMG_SRC="$(find tauri-shell/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          mkdir -p release-assets
          # ditto --keepParent 保留 .app 资源 fork 与权限（macOS 分发惯例）
          ditto -c -k --keepParent "$APP" "release-assets/Deepseek Harness EAC_${VERSION}_macos-arm64.app.zip"
          cp "$DMG_SRC" "release-assets/Deepseek Harness EAC_${VERSION}_macos-arm64.dmg"
          cd release-assets
          shasum -a 256 *.zip *.dmg > SHA256SUMS-macos.txt
          ls -lh

      - name: 上传构建产物（7 天保留）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-macos-arm64-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: 创建/追加 Release（tag 已存在则并入，否则建草稿；署名 macOS 移植贡献者）
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ inputs.tag }}"
          VERSION="5.1.0"
          EXISTING=0
          if gh release view "$TAG" >/dev/null 2>&1; then EXISTING=1; fi
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## macOS（Apple Silicon arm64）桌面预览版

          - 版本：5.1.0 · 架构：arm64 · 系统要求：macOS 13.0+
          - 与 Windows/Linux 完全同源：L1 Tauri 壳 + L2 Node sidecar + L3 DSH 内核

          ### 🧑‍💻 macOS 桌面支持贡献
          - 移植作者：[@CharlesAQ](https://github.com/CharlesAQ)
          - 实现：PR [#234](https://github.com/zouyuxuan122/Deepseek-Harness-EAC/pull/234)（macos-port，AppleScript 转义 / pbcopy / ditto 诊断包 / darwin 资源装配与裁剪 / .app/.dmg 打包配置），已合并进 main
          - 本发布随该 PR 合并上线；能力矩阵与实现规格见 PR 正文与 `docs/superpowers/specs/2026-08-27-macos-desktop-support-design.md`

          ### 验证（GitHub Actions macos-14 全链路实测通过）
          - darwin 全量测试 0 fail / 8 skip
          - stage-resources --target=darwin 装配 + 裁剪审计通过
          - `tauri build` 产出 .app + .dmg；打包态 --bridge-test 4/4
          - 启动冒烟：open 拉起 → Web HTTP 200 → 优雅退出零残留

          ### 下载与使用
          - `.dmg`：双击挂载后拖入 Applications
          - `.app.zip`：解压后直接运行
          - 未签名、未公证（个人自用定位）：首次打开若被 Gatekeeper 拦截，右键 → 打开

          ### darwin 能力说明
          supported：窗口 / 托盘 / 单实例 / 浮窗 / 文件树 / 终端 / 市场 / 皮肤 · degraded：进程围栏 · external-dependency：OCR · 客户端自更新关闭（dsh agent 更新保留）· 快捷方式维护 unavailable
          EOF
          # 统一命名后上传（.app.zip / .dmg / 校验和）
          cd release-assets
          if [ "$EXISTING" = 1 ]; then
            echo "目标 tag $TAG 已存在 → 仅追加 macOS 资产（不动标题与既有正文）"
            gh release upload "$TAG" \
              "Deepseek Harness EAC_${VERSION}_macos-arm64.app.zip" \
              "Deepseek Harness EAC_${VERSION}_macos-arm64.dmg" \
              SHA256SUMS-macos.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,url -q '"  已并入：name="+.name+"  draft="+(.isDraft|tostring)+"  url="+.url'
          else
            gh release create "$TAG" \
              "Deepseek Harness EAC_${VERSION}_macos-arm64.app.zip" \
              "Deepseek Harness EAC_${VERSION}_macos-arm64.dmg" \
              SHA256SUMS-macos.txt \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Deepseek Harness EAC macOS（Apple Silicon arm64）v${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md"
            echo "草稿 Release 创建完成："
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,url -q '"  name="+.name+"  draft="+(.isDraft|tostring)+"  url="+.url'
          fi