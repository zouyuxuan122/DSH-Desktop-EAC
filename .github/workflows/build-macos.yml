name: Build macOS packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/arch-linux
    tags:
      - "v*"
    # 纯文档提交不触发构建（README / docs 等）
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  # macOS 只能在 macOS 主机上打包（dmg 依赖 hdiutil），用 GitHub 托管的云 Mac。
  # 每个架构用对应架构的 runner：原生负载（koffi/sharp/node-pty/...）由 npm ci
  # 按 runner 架构安装，vendor/node 由 fetch-runtime 复制 runner 的 Node ——
  # 架构必须匹配，不能在一个 runner 上交叉出另一个架构的包。
  build-macos-x64:
    name: Build macOS x64 (Intel)
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci --allow-remote=all
        working-directory: dsh-desktop

      - name: Fetch bundled Node runtime and npm CLI
        run: npm run fetch-runtime
        working-directory: dsh-desktop

      - name: Run tests
        run: npm test
        working-directory: dsh-desktop

      # 无签名证书时跳过签名探测，产出未签名 dmg/zip（用户右键「打开」即可运行）。
      - name: Build macOS x64 packages (dmg + zip)
        run: npm run dist:mac -- --x64
        working-directory: dsh-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show built artifacts
        run: ls -lh dist/
        working-directory: dsh-desktop

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-x64-${{ github.run_id }}
          path: |
            dsh-desktop/dist/*.dmg
            dsh-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: Build macOS arm64 (Apple Silicon)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci --allow-remote=all
        working-directory: dsh-desktop

      - name: Fetch bundled Node runtime and npm CLI
        run: npm run fetch-runtime
        working-directory: dsh-desktop

      - name: Run tests
        run: npm test
        working-directory: dsh-desktop

      - name: Build macOS arm64 packages (dmg + zip)
        run: npm run dist:mac -- --arm64
        working-directory: dsh-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show built artifacts
        run: ls -lh dist/
        working-directory: dsh-desktop

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-arm64-${{ github.run_id }}
          path: |
            dsh-desktop/dist/*.dmg
            dsh-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach macOS packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-macos-*
          merge-multiple: true
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
