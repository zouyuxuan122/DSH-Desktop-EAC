# 清除编译缓存：手动触发（Actions 页面 -> 选择本工作流 -> Run workflow）。
# 可选输入 prefix：只删除 key 以该前缀开头的缓存（如 dsh-electron-、dsh-electron-builder-），
# 留空则删除仓库全部 Actions 缓存（npm 缓存 + Electron 二进制 + electron-builder 工具链）。
name: 清除编译缓存

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: '仅删除 key 以此开头的缓存（留空 = 全部删除）'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  clear-cache:
    name: 删除 GitHub Actions 编译缓存
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 列出并删除缓存
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          echo "=== 删除前的缓存列表 ==="
          if [ -n "$PREFIX" ]; then
            gh cache list --key "$PREFIX" --limit 1000
            count=$(gh cache list --key "$PREFIX" --limit 1000 --json id --jq 'length')
            if [ "$count" -eq 0 ]; then
              echo "没有匹配前缀 '$PREFIX' 的缓存，无需删除。"
              exit 0
            fi
            echo "=== 删除 $count 个匹配 '$PREFIX' 的缓存 ==="
            for id in $(gh cache list --key "$PREFIX" --limit 1000 --json id --jq '.[].id'); do
              gh cache delete "$id" && echo "已删除缓存 $id"
            done
          else
            gh cache list --limit 1000
            echo "=== 删除全部缓存 ==="
            gh cache delete --all
          fi
          echo "=== 删除后的缓存列表 ==="
          gh cache list --limit 1000 || true
