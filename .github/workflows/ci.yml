# CI：push / PR 时跑测试并校验原生模块（Windows x64）
# 缓存策略（两层，均按 dsh-desktop/package-lock.json 哈希命中）：
#   1. npm 依赖下载缓存（setup-node 内置）
#   2. cargo 注册表与原生模块构建产物缓存
# 镜像说明：GitHub 托管 runner 直连 npm registry / GitHub Releases，无需 README
# 中的 ELECTRON_MIRROR 等镜像（仅自托管国内 runner 才需要，从美国 runner 访问 npmmirror 反而更慢）。
name: CI

on:
  # paths 负向匹配（跳过纯文档改动，但 SKILL.md 随包分发，必须放行）：
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并构建 dsh-desktop（Windows x64）
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 校验开发者 Skill（PowerShell 7）
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          .\.agents\skills\deepseek-harness-eac-dev\scripts\validate-skill.ps1 `
            -SkillPath .\.agents\skills\deepseek-harness-eac-dev `
            -RepoPath .

      - name: 校验开发者 Skill（Windows PowerShell 5.1）
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          .\.agents\skills\deepseek-harness-eac-dev\scripts\validate-skill.ps1 `
            -SkillPath .\.agents\skills\deepseek-harness-eac-dev `
            -RepoPath . `
            -SkipRuntimeMatrix

      - name: 安装 Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表与原生模块构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-desktop/native/supervisor/target
            dsh-desktop/native/snapshot/target
          key: dsh-cargo-win-x64-${{ hashFiles('dsh-desktop/native/*/Cargo.lock') }}
          restore-keys: |
            dsh-cargo-win-x64-

      - name: 准备内核依赖缓存
        run: |
          npm install --global pnpm@11.7.0
          node scripts/fetch-kernel.js
          npm pack @deepseek-ai/schemastery@3.18.1 --pack-destination vendor/kernel/0.1.2-alpha.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: 安装依赖
        run: npm ci

      - name: 获取内置运行时（node.exe + npm CLI）
        run: npm run fetch-runtime

      - name: 类型检查（tsc --noEmit 零错误）
        run: npm run typecheck

      - name: Rust clippy（-D warnings 零告警）
        run: npm run clippy:native

      - name: Rust 原生模块测试（cargo test --release）
        run: npm run test:native

      - name: 构建 Rust 原生模块（supervisor + snapshot）
        run: npm run build:native && npm run build:native -- snapshot

      - name: 运行测试（超过 15 分钟自动重新开始，最多 3 次）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error,timeout
          command: npm --prefix dsh-desktop test

  build-linux:
    name: 测试并构建 Tauri（Ubuntu 22.04 x64）
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 桌面构建依赖
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖并获取 Linux runtime
        run: |
          npm install --global pnpm@11.7.0
          node scripts/fetch-kernel.js
          npm pack @deepseek-ai/schemastery@3.18.1 --pack-destination vendor/kernel/0.1.2-alpha.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci && npm run fetch-runtime

      - name: 类型检查与全量测试
        run: npm run typecheck && npm test

      - name: Rust 原生模块 clippy、测试与构建
        run: |
          npm run clippy:native
          npm run clippy:native -- snapshot
          npm run test:native
          npm run test:native -- snapshot
          npm run build:native
          npm run build:native -- snapshot

      - name: 装配并审计 Linux 运行树
        working-directory: ${{ github.workspace }}
        run: |
          node tauri-shell/stage-resources.mjs --target=linux
          node tauri-shell/audit-linux-bundle.mjs tauri-shell/staged-resources

      - name: 构建 deb 和 AppImage
        working-directory: tauri-shell
        run: npx -y @tauri-apps/cli@2 build --bundles deb,appimage --ci

      - name: 解包并审计最终 Linux 产物
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          audit_tree() {
            local tree="$1"
            local resources
            resources="$(dirname "$(find "$tree" -type d -name dsh-desktop -print -quit)")"
            test -d "$resources/dsh-desktop"
            node tauri-shell/audit-linux-bundle.mjs "$resources" "$tree"
          }
          audit_tmp="$(mktemp -d)"
          trap 'rm -rf "$audit_tmp"' EXIT
          deb="$(find tauri-shell/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find tauri-shell/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb" && test -n "$appimage"
          dpkg-deb -x "$deb" "$audit_tmp/deb"
          audit_tree "$audit_tmp/deb"
          chmod +x "$appimage"
          appimage="$(readlink -f "$appimage")"
          mkdir "$audit_tmp/appimage"
          (cd "$audit_tmp/appimage" && "$appimage" --appimage-extract >/dev/null)
          audit_tree "$audit_tmp/appimage/squashfs-root"

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-x64-ci
          path: |
            tauri-shell/target/release/bundle/deb/*.deb
            tauri-shell/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
