# ⚠️ 本 workflow 已禁用（Electron 壳冻结，见 HANDOVER R6/R7 红线）：
# 重构版发布只走 release-tauri.yml（Tauri 壳 + NSIS + 便携包）。推送 v* 标签
# 不会再触发 Electron 构建。保留此文件仅记录 Electron 链路的存在，勿手动启用。
name: Release (Electron - DISABLED)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布（Windows x64）
    if: false
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码（标签指向的提交）
        uses: actions/checkout@v4

      - name: 从标签提取版本号
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::'$raw' 不是有效的版本号（期望形如 4.4.1 或 4.4.1-rc.1）"
            exit 1
          fi
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "标签: ${tag} -> 版本号: ${version}"

      - name: 安装 Node.js（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: dsh-electron-win-x64-${{ hashFiles('dsh-desktop/package-lock.json') }}
          restore-keys: |
            dsh-electron-win-x64-

      - name: 缓存 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: dsh-electron-builder-win-x64-${{ hashFiles('dsh-desktop/package-lock.json') }}
          restore-keys: |
            dsh-electron-builder-win-x64-

      - name: 安装依赖
        run: npm ci

      - name: 获取内置运行时（node.exe + npm CLI）
        run: npm run fetch-runtime

      - name: 将标签版本号写入 package.json
        run: npm version ${{ steps.tag.outputs.version }} --no-git-tag-version --allow-same-version

      - name: 运行测试
        run: npm test

      - name: 构建产物（portable + NSIS 安装包 + SHA256SUMS）
        run: npm run dist

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dsh-desktop/dist/Deepseek-Harness-EAC-Setup-*.exe
            dsh-desktop/dist/Deepseek-Harness-EAC-Portable-*.exe
            dsh-desktop/dist/*.blockmap
            dsh-desktop/dist/SHA256SUMS.txt
