name: Build Linux packages

on:
  workflow_dispatch:
  # PR 也跑 CI：修复分支不必先合进 main 才能验证 workflow 改动
  # （此前 fix 分支只能 workflow_dispatch 手动触发，调试 CI 很痛苦）。
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      - codex/arch-linux
    tags:
      - "v*"
    # 纯文档提交不触发构建（README / docs 等）
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  # node-pty@1.1.0 不带 linux-x64 预编译，安装时由 node-gyp 现场编译。在构建机
  # （Arch glibc 2.42 / Ubuntu runner 2.39+）上编译会绑定新 glibc，Debian 13
  # （2.41）及更老系统加载即崩（2026-08 Debian 事故）。统一在 debian:12 容器
  # （glibc 2.36，产物实测 ≤ GLIBC_2.34）里编译，产物作为构建物供两个打包 job 使用。
  build-node-pty:
    name: Build node-pty in debian:12 (glibc baseline)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild node-pty inside debian:12 container
        run: |
          set -euo pipefail
          mkdir -p pty-artifact
          docker run --rm -v "$PWD/pty-artifact:/out" debian:12 bash -c '
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq build-essential python3 curl >/dev/null
            # 官方 node v24.19.0（⚠️ 绝不用 Debian 自带 nodejs：其 node-gyp 会链 libnode.so.108）
            curl -sL https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
            export PATH=/usr/local/bin:$PATH
            mkdir -p /build && cd /build && npm init -y >/dev/null 2>&1
            npm install node-pty@1.1.0 --ignore-scripts >/dev/null 2>&1
            cd node_modules/node-pty
            node /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild
            cp build/Release/pty.node /out/pty.node
          '
          # glibc 基线检查：阈值与扫描逻辑统一在 dsh-desktop/scripts/check-glibc.cjs
          node dsh-desktop/scripts/check-glibc.cjs pty-artifact/pty.node

      - name: Upload pty.node artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-pty-linux-x64
          path: pty-artifact/pty.node
          if-no-files-found: error
          retention-days: 7

  build-pacman:
    name: Build pacman package on Arch Linux
    runs-on: ubuntu-latest
    needs: build-node-pty
    container:
      image: archlinux:base-devel

    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm
          # 使用系统 Ruby + fpm 而不是 electron-builder 下载的预编译 fpm：
          # 后者自带的 ruby 依赖 libcrypt.so.1，Arch 官方仓库没有该 ABI。
          # Node 固定到 22 LTS（nodejs-lts-jod，Provides: nodejs=22.x），与
          # deb/rpm/AppImage CI 的 node-version: 22 保持一致——不再跟随滚动版
          # nodejs（3.0.1 事故：Arch 包捆绑 Node 26 而其余 Linux 包是 Node 22）。
          # python 用于 node-pty 的 node-gyp 编译：该包 1.1.0 不带 linux-x64
          # 预编译产物，Linux 安装时必须现场编译出 build/Release/pty.node。
          pacman -S --needed --noconfirm nodejs-lts-jod npm git ruby ruby-erb python
          node --version
          npm --version

      - name: Install fpm gem
        run: |
          gem install fpm --no-document --bindir /usr/local/bin
          /usr/local/bin/fpm --version

      - uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm ci --allow-remote=all
        working-directory: dsh-desktop

      # 用 debian:12 容器编译的 pty.node 覆盖现场编译产物，保证 glibc ≤ 2.34
      - uses: actions/download-artifact@v4
        with:
          name: node-pty-linux-x64
          # 下载路径必须含 dsh-desktop：download-artifact 相对仓库根解析，
          # 而 override 步骤在 working-directory: dsh-desktop 下引用 pty-artifact/。
          path: dsh-desktop/pty-artifact

      - name: Override node-pty with debian:12-built binary (glibc baseline)
        run: |
          set -euo pipefail
          mkdir -p node_modules/node-pty/build/Release
          cp pty-artifact/pty.node node_modules/node-pty/build/Release/pty.node
          node scripts/check-glibc.cjs node_modules/node-pty/build/Release/pty.node
        working-directory: dsh-desktop

          # node-pty@1.1.0 不提供 linux-x64 预编译包，
      # 必须在安装阶段由 node-gyp 现场编译出 build/Release/pty.node。若这里没
      # 生成（脚本被跳过 / 工具链缺失），装出来的包启动即报
      # "Cannot find module './prebuilds/linux-x64//pty.node'"（3.0.1 Arch 事故）。
      # 用与打包完全相同的 Node 立即加载一次，让失败发生在 CI 而不是用户机器上。
      - name: Verify node-pty native module compiles and loads
        run: node -e "const pty = require('node-pty'); if (typeof pty.spawn !== 'function') throw new Error('node-pty API 异常'); console.log('node-pty OK @', process.version, process.platform + '-' + process.arch)"
        working-directory: dsh-desktop

      - name: Fetch bundled Node runtime and npm CLI
        run: npm run fetch-runtime
        working-directory: dsh-desktop

      - name: Report bundled runtime versions
        run: |
          ./vendor/node/node --version
          ./vendor/node/node vendor/npm/bin/npm-cli.js --version
        working-directory: dsh-desktop

      - name: Run tests
        run: npm test
        working-directory: dsh-desktop

      # 国内网络不佳的 fork 可以打开下面两行镜像：
      # env:
      #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      #   ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - name: Build pacman package
        run: npm run dist:arch
        working-directory: dsh-desktop
        env:
          USE_SYSTEM_FPM: "true"

      # 打包后的最后一道防线：在最终 pacman 归档层面复核 node-pty 存在性 /
      # 捆绑 Node 可加载 / 全部原生载荷 glibc ≤ 2.34（scripts/audit-linux-package.sh）。
      # 3.0.1 Arch 事故就是缺这层校验——afterPack 审计只覆盖展开目录，
      # 归档阶段仍可能丢文件。
      - name: Verify pacman payload (archive-level audit)
        run: bash scripts/audit-linux-package.sh dist/*.pacman
        working-directory: dsh-desktop

      - name: Show built artifacts
        run: ls -lh dist/
        working-directory: dsh-desktop

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-pacman-${{ github.run_id }}
          path: dsh-desktop/dist/*.pacman
          if-no-files-found: error
          retention-days: 30

  build-deb-rpm-appimage:
    name: Build deb / rpm / AppImage on Ubuntu
    runs-on: ubuntu-latest
    needs: build-node-pty

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci --allow-remote=all
        working-directory: dsh-desktop

      # 用 debian:12 容器编译的 pty.node 覆盖现场编译产物，保证 glibc ≤ 2.34
      - uses: actions/download-artifact@v4
        with:
          name: node-pty-linux-x64
          # 下载路径必须含 dsh-desktop：download-artifact 相对仓库根解析，
          # 而 override 步骤在 working-directory: dsh-desktop 下引用 pty-artifact/。
          path: dsh-desktop/pty-artifact

      - name: Override node-pty with debian:12-built binary (glibc baseline)
        run: |
          set -euo pipefail
          mkdir -p node_modules/node-pty/build/Release
          cp pty-artifact/pty.node node_modules/node-pty/build/Release/pty.node
          node scripts/check-glibc.cjs node_modules/node-pty/build/Release/pty.node
        working-directory: dsh-desktop

      # 与 pacman 构建相同的 node-pty 加载校验：Linux 安装时 node-pty 必须由
      # node-gyp 现场编译（npm 包不带 linux-x64 prebuilds），缺了安装包即废。
      - name: Verify node-pty native module compiles and loads
        run: node -e "const pty = require('node-pty'); if (typeof pty.spawn !== 'function') throw new Error('node-pty API 异常'); console.log('node-pty OK @', process.version, process.platform + '-' + process.arch)"
        working-directory: dsh-desktop

      - name: Fetch bundled Node runtime and npm CLI
        run: npm run fetch-runtime
        working-directory: dsh-desktop

      - name: Report bundled runtime versions
        run: |
          ./vendor/node/node --version
          ./vendor/node/node vendor/npm/bin/npm-cli.js --version
        working-directory: dsh-desktop

      - name: Run tests
        run: npm test
        working-directory: dsh-desktop

      # 国内网络不佳的 fork 可以打开下面两行镜像：
      # env:
      #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      #   ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - name: Build deb / rpm / AppImage
        run: npm run dist:deb && npm run dist:rpm && npm run dist:appimage
        working-directory: dsh-desktop

      # 归档级终检工具（rpm 解包用）：ubuntu runner 默认不带 rpm2cpio / cpio。
      - name: Install archive audit tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm2cpio cpio

      # 与 pacman job 相同的最后一道防线：在最终 deb / rpm / AppImage 归档层面
      # 复核 node-pty 存在性 / 捆绑 Node 可加载 / 全部原生载荷 glibc ≤ 2.34。
      # 此前只有 pacman 有归档审计，三种格式缺同样的防线。
      - name: Verify deb / rpm / AppImage payloads (archive-level audit)
        run: bash scripts/audit-linux-package.sh dist/*.deb dist/*.rpm dist/*.AppImage
        working-directory: dsh-desktop

      - name: Show built artifacts
        run: ls -lh dist/
        working-directory: dsh-desktop

      - name: Upload deb / rpm / AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-packages-${{ github.run_id }}
          path: |
            dsh-desktop/dist/*.deb
            dsh-desktop/dist/*.rpm
            dsh-desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach Linux packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-pacman, build-deb-rpm-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          merge-multiple: true
          path: release-artifacts

      # V4 客户端更新的 SHA-256 内容校验读取 Release 附带的 SHA256SUMS.txt；
      # 归档产物汇齐后统一生成（脚本已支持 pacman/deb/rpm/AppImage 格式）。
      - name: Generate SHA256SUMS.txt for release assets
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run make-release-hashes
        run: node scripts/make-release-hashes.js ../release-artifacts
        working-directory: dsh-desktop

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          generate_release_notes: true
          # 版本隔离：-linux Release 永远不占 /releases/latest —— 该端点被
          # v4 之前的老 Windows 客户端当作唯一更新源（v4 起才有按资产过滤
          # 的平台围栏）。latest 必须始终指向 Windows Release，否则老客户端
          # 会拿到只有 Linux 资产的 latest（虽因无 .exe 装不上，但会弹
          # 「未找到安装包」错误）。Windows tag 走本 workflow 时保持默认。
          make_latest: ${{ endsWith(github.ref, '-linux') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
