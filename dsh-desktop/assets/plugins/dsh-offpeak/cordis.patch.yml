# dsh-offpeak 补丁：向 profile 插入 offpeak 行。
#
# Host half (src/index.js):
#   - 监听会话事件 user/message 作为兜底：未拦截路径的命令在高峰时段
#     （北京时间 9:00–12:00、14:00–18:00）到达且当日未勾选「不再提醒」时，
#     生成待展示提醒（含命令文本、当前模型、价目表）；
#   - 通过 webServer 路由 /ds-offpeak/* 与浏览器交互：状态轮询、确认/忽略、
#     今日不再提醒、登记定时任务、取消任务、手动执行；
#   - 定时任务持久化到 profile 目录 offpeak.json，到点经 apiProxy（session.prompt
#     同路径）把命令文本重新提交给原会话执行，浏览器无需在线。
# Browser half (client/client.js, dsh.client manifest):
#   - 高峰时段在 composer 提交瞬间（Enter / 发送按钮）拦截发送：消息保留在
#     输入框，弹窗显示当前模型高峰/闲时价目表与命令文本；
#   - 「继续执行」重新派发提交事件走正常路径；「定时执行」打开小时轮
#     （仅 0–8、18–23 点，已过去的时间移除，23 之后滚动到次日 0–8，分钟 00–59），
#     确认后登记到服务端并在到点自动提交；
#   - 勾选「今日不再提醒」后当天（北京时间）不再拦截/弹窗。
- insert:
    - id: offpeak
      name: 'dsh-offpeak'
      config:
        # 峰谷定价生效日（北京时间）；此前插件休眠，不拦截不弹窗。
        effectiveFrom: '2026-08-17'
        # 调试开关：true 时忽略生效日期限制（便于验证），默认 false。
        debug: false
