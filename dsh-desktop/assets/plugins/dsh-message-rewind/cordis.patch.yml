# dsh-message-rewind bundle patch: Trae-style message rewind. The client half
# (lib/client.js) captures the per-session composer context through the
# "conversation.composer.dock" list slot, injects an edit button into every
# user message row, and performs rewind by forking the session at the previous
# completed turn (sessions.fork) then resubmitting the edited draft
# (inputActions). The host half is intentionally a no-op — everything runs in
# the browser against public client-runtime services.

- insert:
    - id: message-rewind
      name: 'dsh-message-rewind'
