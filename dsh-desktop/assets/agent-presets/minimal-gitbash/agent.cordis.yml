# The `minimal-gitbash` agent preset: the shipped `minimal` preset's Windows
# variant. Same fixed persona and str_replace_editor surface, but the bash tool
# runs every command through Git for Windows bash instead of the persistent PTY
# shell (which `subprocess-local` cannot spawn on win32 at all).
#
# Sandbox: the MSYS runtime cannot initialize inside the Windows restricted-
# token sandbox, so the executor gates commands on the danger-full-access
# policy — switch the session to full access, or let the model retry a single
# command with sandbox_permissions: "danger-full-access" + justification.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed, and the model composes only `bash` and
# `str_replace_editor`. Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The shell provider is an agent-owned service, so it lives in an entry-local
# realm like the shipped preset's PTY registry did. The executor consumes the
# host subprocess service, while the tool registers into this agent's scoped
# catalog. The local module carries no package imports because preset-local
# files resolve against the preset directory, not DSH's node_modules.
- id: gitbash-shell
  name: cordis:group
  group: true
  isolate:
    shell: true
  config:
    - id: gitbash-executor
      name: ./gitbash-executor.mjs
      config:
        # shellPath 留空：executor 自动探测 GIT_BASH → 常见安装目录 → PATH → 'bash'
        # 如需固定路径可显式写 shellPath: 'C:\\Program Files\\Git\\bin\\bash.exe'
        timeoutMs: 120000
        maxTimeoutMs: 600000
        maxOutputBytes: 64000
        maxSpillBytes: 67108864
        graceMs: 3000

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      config:
        enableRunInBackground: false

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
