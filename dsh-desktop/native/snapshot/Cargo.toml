[package]
name = "dsh-snapshot-native"
version = "0.1.0"
edition = "2021"
description = "DSH Desktop 快照管理器引擎（.dsh 目录 git 式增量备份：内容寻址去重 / 快照树 / 分支 / 恢复）"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }

[target.'cfg(not(windows))'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }

[dependencies]
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
