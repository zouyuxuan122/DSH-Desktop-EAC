[package]
name = "dsh-supervisor-native"
version = "0.1.0"
edition = "2021"
description = "DSH Desktop Supervisor 的 OS 级进程围栏（Win32 Job Object）与流式 SHA-256"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }

[target.'cfg(not(windows))'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }

[dependencies]
napi-derive = "3"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
